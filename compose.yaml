name: li-dong-le
services:
  android:
    platform: linux/amd64
    cpus: ${ANDROID_CPUS:-4}
    mem_limit: ${ANDROID_MEMORY:-6g}
    image: ${COMPOSE_PROJECT_NAME:-li-dong-le}-android:local
    build:
      context: .
      dockerfile: Dockerfile.android
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f}
        REDROID_IMAGE: ${REDROID_IMAGE:-erstt/redroid@sha256:7c1f4355fa245e55cc15fa46ff3be8c347cee73c3eeb5c8b7a6def93013eb54d}
    privileged: true
    restart: unless-stopped
    command:
      - androidboot.use_memfd=1
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=240
      - androidboot.redroid_fps=10
      - androidboot.redroid_net_ndns=2
      - androidboot.redroid_net_dns1=${ANDROID_DNS_1:-223.5.5.5}
      - androidboot.redroid_net_dns2=${ANDROID_DNS_2:-1.1.1.1}
      - ro.secure=0
      - ro.dalvik.vm.native.bridge=libhoudini.so
      - ro.enable.native.bridge.exec64=1
    volumes:
      - ${LDL_DATA_DIR:-../li-dong-le-data}/android:/data
    healthcheck:
      test: [CMD, /system/bin/sh, -c, "[ \"$(getprop sys.boot_completed)\" = 1 ]"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  controller:
    platform: linux/amd64
    cpus: 2
    mem_limit: 1g
    image: ${COMPOSE_PROJECT_NAME:-li-dong-le}-controller:local
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${UI_PORT:-6080}:6080
    depends_on:
      android:
        condition: service_healthy
    environment:
      ADB_TARGET: android:5555
      FRIDA_TARGET: android:27042
      LDL_STATE_DIR: /data/state
      LDL_WECHAT_APK: wechat-official-arm32.apk
      LDL_HTTPS_PROXY: ${LDL_HTTPS_PROXY:-}
    volumes:
      - ${LDL_DATA_DIR:-../li-dong-le-data}/controller:/data
      - ${LDL_APK_DIR:-./apks}:/apks:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
