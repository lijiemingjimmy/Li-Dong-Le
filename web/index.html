<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Android 远程操作</title><link rel="stylesheet" href="/style.css">
<main><header><strong>Android 远程操作</strong><span id="status">正在连接…</span></header>
<p class="hint">点击画面操作，拖动滑动。画面约每秒更新一次。</p>
<div id="display"><img id="screen" alt="Android 画面" draggable="false"></div>
<nav><button data-action="wake">唤醒</button><button data-action="back">返回</button><button data-action="home">主屏幕</button><button data-action="recent">最近任务</button></nav>
<form id="typing"><input id="text" type="password" placeholder="先点 Android 输入框，再在此输入" aria-label="发送至 Android 的文字" autocomplete="off" maxlength="256"><button>输入</button></form>
<div class="keys"><button data-action="delete">退格</button><button data-action="enter">回车</button><button id="toggle">显示输入</button><button id="pause">暂停画面</button></div>
<p class="hint">文字栏支持英文、数字和符号；中文可用 Android 内的键盘。关闭页面会停止画面传输。</p></main><script src="/app.js"></script></html>
